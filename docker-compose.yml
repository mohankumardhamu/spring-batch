name: spring-batch-microservices

x-db-credentials: &db-credentials
  DB_USERNAME: ${POSTGRES_USER:-postgres}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    # pools: user 30 + order 20 + payment 20 + batch 40 = 110 connections > the default limit of 100
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: .
      args:
        SERVICE: user-service
    image: user-service:1.0.0
    container_name: user-service
    environment:
      <<: *db-credentials
      DB_URL: jdbc:postgresql://postgres:5432/userdb
      DB_POOL_SIZE: 30
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: .
      args:
        SERVICE: order-service
    image: order-service:1.0.0
    container_name: order-service
    environment:
      <<: *db-credentials
      DB_URL: jdbc:postgresql://postgres:5432/orderdb
      DB_POOL_SIZE: 20
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build:
      context: .
      args:
        SERVICE: payment-service
    image: payment-service:1.0.0
    container_name: payment-service
    environment:
      <<: *db-credentials
      DB_URL: jdbc:postgresql://postgres:5432/paymentdb
      DB_POOL_SIZE: 20
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  batch-service:
    build:
      context: .
      args:
        SERVICE: batch-service
    image: batch-service:1.0.0
    container_name: batch-service
    environment:
      <<: *db-credentials
      DB_URL: jdbc:postgresql://postgres:5432/batchdb
      DB_POOL_SIZE: 40
      USER_SERVICE_URL: http://user-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      PROPAGATION_CHUNK_SIZE: ${PROPAGATION_CHUNK_SIZE:-100}    # users per chunk/transaction
      PROPAGATION_CONCURRENCY: ${PROPAGATION_CONCURRENCY:-32}   # chunks processed in parallel
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started

volumes:
  postgres-data:
