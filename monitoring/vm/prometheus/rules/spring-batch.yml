# Alert rules, shown in Prometheus (Alerts) and Grafana (Alerting → Alert rules).
groups:
  - name: spring-batch
    rules:
      - alert: ServiceDown
        expr: up{job=~"spring-batch|postgres"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} is down"
          description: "Prometheus could not scrape {{ $labels.instance }} for 1 minute."

      - alert: HighHttpErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: more than 5% of requests fail with 5xx"

      - alert: SlowHttpRequests
        expr: |
          histogram_quantile(0.95, sum by (application, le) (
            rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: p95 latency above 1 s"

      - alert: PropagationFailures
        expr: sum by (stage) (increase(propagation_users_total{result="failed"}[10m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | humanize }} users failed propagation at {{ $labels.stage }} in the last 10 minutes"
          description: "Check GET /api/propagate/{id}/items?status=FAILED and retry with POST /api/propagate/{id}/retry."

      - alert: DbConnectionPoolExhausted
        expr: max by (application) (hikaricp_connections_pending) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: threads waiting for a database connection for 5 minutes"

      - alert: JvmHeapHigh
        expr: |
          sum by (application) (jvm_memory_used_bytes{area="heap"})
            / sum by (application) (jvm_memory_max_bytes{area="heap"} > 0) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.application }}: heap above 90% for 10 minutes"
