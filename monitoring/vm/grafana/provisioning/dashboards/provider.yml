# Loads grafana/dashboards/*.json (generated by grafana/generate_dashboards.py).
apiVersion: 1

providers:
  - name: spring-batch
    folder: Spring Batch
    type: file
    disableDeletion: true
    allowUiUpdates: false        # change generate_dashboards.py instead, then: vm.sh deploy
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
