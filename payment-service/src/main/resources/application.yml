server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true          # Tomcat request handling runs on virtual threads (Java 21)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paymentdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # /actuator/prometheus is scraped by the monitoring VM
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # histogram buckets, so Grafana can show p50/p95/p99 latency
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
